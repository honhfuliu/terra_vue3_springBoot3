server:
  port: 8080

# API 接口配置
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'admin'
      display-name: '系统管理'
      paths-to-match: '/**'
      packages-to-scan: com.ziheng.system

# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 600
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  token-style: random-128
  is-log: true
  is-read-cookie: false   # 不再从 cookie 里读 token